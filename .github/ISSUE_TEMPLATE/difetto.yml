name: Difetto
description: Qualcosa non funziona come dovrebbe
title: "[Difetto] "
labels: ["difetto"]
body:
  - type: textarea
    id: cosa-succede
    attributes:
      label: Cosa succede
      description: Descrivi il comportamento sbagliato, senza ipotesi sulla causa.
      placeholder: Il totale della fattura non tiene conto dello sconto concordato.
    validations:
      required: true
  - type: textarea
    id: cosa-dovrebbe-succedere
    attributes:
      label: Cosa dovrebbe succedere
    validations:
      required: true
  - type: textarea
    id: come-riprodurlo
    attributes:
      label: Come riprodurlo
      description: I passi minimi per vedere il problema.
  - type: dropdown
    id: impatto
    attributes:
      label: Impatto sul cliente
      options:
        - Blocca il lavoro di un cliente
        - Fastidioso ma aggirabile
        - Solo estetico
    validations:
      required: true
